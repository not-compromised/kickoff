# Build mutants (docs/SECURITY-INVARIANTS.md, SI-33). Each [[mutant]] names a
# cargo feature `mutant-si<N>-<slug>` that compiles one protection out of the
# package `crate`, and the test function that must FAIL with it enabled and
# PASS without it. `test_crate` names the package holding that test when it is
# not `crate`. `cargo run -p kickoff-xtask -- mutants` runs them all, and
# scripts/check.sh runs that; xtask/tests/si_33_policy.rs checks this file
# against the invariant table and the workspace.
#
# An entry may also be written on one line:
#   [[mutant]] si = "SI-3", crate = "...", feature = "...", test = "...", note = "..."
# Strings take \" and \\ escapes only.
#
# [[unmutated]]: an SI test that no feature flag can falsify, with the reason.
# [[pending]]:   a gap in an M2 row that this branch does not close yet; `item`
#                is a named mutant, `test` or `mutant`. The policy fails once
#                the gap is gone, so the entry must then be removed.

# SI-33

[[mutant]]
si = "SI-33"
crate = "kickoff-xtask"
feature = "mutant-si33-tests-only"
test = "si_33_policy_reports_rows_without_tests_or_mutants"
note = "the policy stops checking that rows have registered mutants"

# kickoff-wire

[[mutant]] si = "SI-3", crate = "kickoff-wire", feature = "mutant-si3-path-field", test = "si_3_peer_messages_cannot_express_eac_paths_or_launch_options", note = "a HostMsg variant carrying a PathBuf"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-nonatomic-nonce", test = "si_20_capability_admits_at_most_once", note = "redeem leaves the nonce outstanding, so a capability admits again"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-nonatomic-nonce", test = "si_20_replayed_capability_refused", note = "redeem leaves the nonce outstanding, so a capability admits again"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-nonatomic-nonce", test = "si_20_bearer_ticket_admits_once", test_crate = "kickoff-session", note = "redeem leaves the nonce outstanding, so a capability admits again"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-nonatomic-nonce", test = "si_20_one_capability_on_many_connections_admits_once", test_crate = "kickoff-session", note = "redeem leaves the nonce outstanding, so a capability admits again"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-nonatomic-nonce", test = "si_20_replayed_ticket_refused", test_crate = "kickoff-session", note = "redeem leaves the nonce outstanding, so a capability admits again"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-nonatomic-nonce", test = "si_20_declined_prompt_spends_the_ticket", test_crate = "kickoff-session", note = "redeem leaves the nonce outstanding, so a capability admits again"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-bearer-never-expires", test = "si_20_bearer_validity_uses_host_monotonic_clock", note = "bearer invites never expire"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-bearer-never-expires", test = "si_20_expired_bearer_ticket_refused", test_crate = "kickoff-session", note = "bearer invites never expire"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-any-session", test = "si_20_ticket_from_another_session_or_host_process_refused", note = "redeem skips the session id check"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-any-session", test = "si_20_ticket_from_a_previous_host_session_refused", test_crate = "kickoff-session", note = "redeem skips the session id check"
[[mutant]] si = "SI-20", crate = "kickoff-wire", feature = "mutant-si20-bound-any-requester", test = "si_20_wrong_invitee_refused_and_the_ticket_survives", test_crate = "kickoff-session", note = "a bound capability redeems for any requester"
[[mutant]] si = "SI-23", crate = "kickoff-wire", feature = "mutant-si23-trust-declared-length", test = "si_23_bounded_vec_refuses_a_declared_length_before_reserving_for_it", note = "BoundedVec reserves the declared length before checking it"
[[mutant]] si = "SI-23", crate = "kickoff-wire", feature = "mutant-si23-unbounded-lists", test = "si_23_declared_length_beyond_bound_refused_before_allocating", note = "BoundedVec ignores its bound when decoding"
[[mutant]] si = "SI-23", crate = "kickoff-wire", feature = "mutant-si23-no-message-cap", test = "si_23_oversize_messages_refused_both_ways", note = "encode and decode skip the per-type MAX_LEN"
[[mutant]] si = "SI-23", crate = "kickoff-wire", feature = "mutant-si23-no-frame-cap", test = "si_23_frame_prefix_checked_before_the_body_is_read", note = "frame_len accepts any announced length"
[[mutant]] si = "SI-29", crate = "kickoff-wire", feature = "mutant-si29-door-with-ip", test = "si_29_ticket_cannot_carry_direct_address", note = "a door address with direct IPs is encoded (IPs dropped) instead of refused"
[[mutant]] si = "SI-30", crate = "kickoff-wire", feature = "mutant-si30-cap-debug", test = "si_30_caps_tickets_and_join_requests_cannot_be_printed_cloned_or_serialized", note = "Cap implements Debug"
[[unmutated]] test = "si_30_ticket_errors_carry_no_input", reason = "WireError variants hold only constants; making one carry input is a type change, not a flag"

