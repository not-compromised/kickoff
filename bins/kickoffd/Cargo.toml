[package]
name = "kickoffd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kickoff-secret.workspace = true
kickoff-ipc.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "macros", "sync"] }


[dev-dependencies]
# The workspace's test build has tokio's signal driver (kickoff-session's
# iroh-relay server turns it on), and so does this package's alone, so
# kickoffd's descriptor tests see one table however they are run.
tokio = { workspace = true, features = ["signal"] }
kickoff-wire.workspace = true
iroh-base.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix.workspace = true
rustix = { workspace = true, features = ["event", "net"] }
