name: M2 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate's two parts on separate runners: release latency (in fast) is
  # timed on the wall clock and must not share a machine with the mutant
  # builds. The gate is passed only when both parts pass.
  linux:
    name: linux (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [fast, mutants]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install namespace test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes uidmap
          if ! awk -F: -v user="$(id -un)" '$1 == user { found=1 } END { exit !found }' /etc/subuid; then
            sudo usermod --add-subuids 1000000-1065535 --add-subgids 1000000-1065535 "$(id -un)"
          fi
          # This disposable runner must exercise the real second-uid and PID-reuse tests.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --map-root-user --pid --fork --mount-proc true
          unshare --map-auto --setuid 0 --setgid 0 true
      - name: Install pinned Rust
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Install scanner
        if: matrix.part == 'fast'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Run the proving gate (${{ matrix.part }})
        env:
          PART: ${{ matrix.part }}
          # Shared runners measure several times slower than the reference
          # machine, so the release latency tests here assert 4x the §7
          # budgets. The exact budgets are asserted by scripts/check.sh on the
          # reference machine, the gate for every merge and release
          # (docs/development.md); it refuses this variable outside Actions.
          KICKOFF_LATENCY_RUNNER: hosted
        run: scripts/check.sh "$PART"

  # The one check to require: green only when every part above succeeded. A
  # required check on a skipped job would count as passing, hence always().
  gate:
    name: gate passed
    needs: linux
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every part
        env:
          RESULT: ${{ needs.linux.result }}
        run: test "$RESULT" = success
