[package]
name = "kickoff-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "../../scripts/mutant-guard.rs"

[lints]
workspace = true

# Mutants (SI-33): each compiles one protection out; registered in
# /mutants.toml, refused in release builds by the build script.
[features]
mutant-si38-no-direct-kill = []
mutant-si38-no-bindsto = []
mutant-si38-sigterm-stop = []
mutant-si36-no-fd-sweep = []
mutant-si36-barrier-skip = []
mutant-si14-no-deny-set = []
mutant-si14-no-startup-probe = []
mutant-si34-copy-writable = []
mutant-si35-host-x11-mounted = []

[target.'cfg(target_os = "linux")'.dependencies]
kickoff-local.workspace = true
nix = { workspace = true, features = ["signal", "net"] }
rustix = { workspace = true, features = ["event", "thread"] }
thiserror.workspace = true
