[package]
name = "kickoff-secret"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "../../scripts/mutant-guard.rs"

[lints]
workspace = true

# Mutants (SI-33): each compiles one protection out; registered in
# /mutants.toml, refused in release builds by the build script.
[features]
mutant-si22-no-state-lock = []
mutant-si22-stale-trust-save = []
mutant-si30-no-wipe = []
mutant-si30-secret-debug = []
mutant-si30-secret-clone = []
mutant-si30-dumpable = []
mutant-si22-world-readable = []
mutant-si22-dir-unchecked = []
mutant-si22-file-unchecked = []
mutant-si22-replace-damaged = []
mutant-si22-reset-keeps-trust = []

[dependencies]
getrandom.workspace = true
iroh-base.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Process hardening (prctl, setrlimit) and the identity store's no-follow,
# handle-relative file operations, all without `unsafe`.
rustix.workspace = true

[dev-dependencies]
serde.workspace = true
rustix = { workspace = true, features = ["fs"] }
