[package]
name = "kickoff-secret"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "../../scripts/mutant-guard.rs"

[lints]
workspace = true

# Mutants (SI-33): each compiles one protection out; registered in
# /mutants.toml, refused in release builds by the build script.
[features]
mutant-si30-no-wipe = []
mutant-si30-secret-debug = []

[dependencies]
iroh-base.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde.workspace = true
